<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break</title>
    <style>
      /* 単独の窓なので、アプリの CSS は読み込まない。
         暗幕以外のものを何も描かないための最小構成。 */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* 濃さとフェードを別の層に分けている。1 枚でやろうとすると、
         「どこまで暗くするか」を変えるたびにフェードの終端を書き換える
         ことになり、途中から掛け直せない。 */
      #wrap {
        height: 100%;
      }
      #veil {
        height: 100%;
        background: #05070a;
        opacity: 0;
        /* 掛けるときはゆっくり。引くときは __unveil が上書きする */
        transition: opacity 3.2s ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        #veil {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="veil"></div></div>
    <script>
      (function () {
        var wrap = document.getElementById("wrap");
        var veil = document.getElementById("veil");

        /**
         * 指定の濃さまで、いきなりではなく数秒かけて落とす。
         * 真っ暗になって驚かせるのが目的ではなく、「そろそろ手を止める
         * 時間だ」と身体で分からせるのが目的なので、必ず 0 から掛け直す。
         *
         * 窓は休憩ごとに作り直さず hide/show で使い回すため、掛け始めを
         * Rust 側からこの関数で叩く。CSS アニメーションのままだと最初の
         * 1 回しか走らない。
         */
        window.__veil = function (alpha) {
          wrap.style.opacity = String(alpha);
          veil.style.transition = "none";
          veil.style.opacity = "0";
          // 0 にした事実をここで確定させてから 1 に上書きする。
          // requestAnimationFrame は窓が隠れている間も、他の窓に覆われて
          // いる間も呼ばれないことがある (WebView が描画を止める)。
          // それだと掛け始めの 1 行が永久に走らず、暗幕が出たまま透明に
          // なる — 出ていないのと同じ。読むだけで確定する offsetHeight
          // なら、描画が止まっていても効く
          void veil.offsetHeight;
          veil.style.transition = "";
          veil.style.opacity = "1";
        };

        /**
         * 掛け終わり。遷移が走らなかったときの保険で、Rust 側が掛け始めから
         * 数秒後に叩く。遷移が正しく走っていれば、同じ値を書くだけで何も
         * 起きない。
         */
        window.__settle = function () {
          veil.style.transition = "none";
          veil.style.opacity = "1";
        };

        /**
         * 暗幕を引く。掛けるときよりずっと短くする。
         *
         * 一気に明るくすると、休憩を切り上げた瞬間に画面が弾けたように
         * 見える。かといって掛けるときと同じ 3 秒では、もう手を動かして
         * いるのに暗いまま待たされる。掛けるのは合図、引くのは後始末。
         */
        window.__unveil = function () {
          veil.style.transition = "opacity 0.8s ease-in";
          veil.style.opacity = "0";
        };

        // 生成直後の 1 回ぶんは、窓の URL に載せてきた濃さを使う
        var a = new URLSearchParams(location.search).get("a");
        window.__veil(a === null ? 0.55 : Number(a));
      })();
    </script>
  </body>
</html>
