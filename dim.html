<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break</title>
    <style>
      /* 単独の窓なので、アプリの CSS は読み込まない。
         暗幕以外のものを何も描かないための最小構成。 */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* 濃さは設定から来る。Rust 側が表示の直前に --veil を書き換える。
         フェードと濃さを分けているのは、キーフレームの終端に変数を置くと
         値が焼き付いて、後から変えても効かなくなるため。 */
      #wrap {
        height: 100%;
        opacity: var(--veil, 0.55);
      }
      /* いきなり真っ暗にすると驚くだけで、休憩に向かう気にはならない。
         数秒かけて落として「そろそろ手を止める時間」を身体で分からせる */
      #veil {
        height: 100%;
        background: #05070a;
        animation: fall 3.2s ease-out forwards;
      }
      @keyframes fall {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #veil {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="wrap"><div id="veil"></div></div>
  </body>
</html>
