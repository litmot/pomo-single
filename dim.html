<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Break</title>
    <style>
      /* 単独の窓なので、アプリの CSS は読み込まない。
         暗幕以外のものを何も描かないための最小構成。 */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      /* いきなり真っ暗にすると驚くだけで、休憩に向かう気にはならない。
         数秒かけて落として「そろそろ手を止める時間」を身体で分からせる */
      #veil {
        height: 100%;
        background: #05070a;
        opacity: 0;
        animation: fall 3.2s ease-out forwards;
      }
      @keyframes fall {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #veil {
          animation: none;
          opacity: 0.55;
        }
      }
    </style>
  </head>
  <body>
    <div id="veil"></div>
  </body>
</html>
